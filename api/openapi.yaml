openapi: 3.0.3
info:
  title: Auction House
  version: 1.0.0
  description: |
    Client-facing RESTful API of the auction house.

    * Reads accept `?consistency=sequential|linearizable` (default: sequential).
      All writes are linearizable.
    * **GET** reads auctions, bid history, closure, and winning bids.
      **POST** creates auctions or places bids. **PUT** closes an auction.
    * Request and success response bodies use `application/json`.
      Errors use `application/problem+json` (RFC 9457).
servers:
  - url: /
    description: The server that serves this page (use with /docs)
  - url: http://localhost:8080
    description: Node n1 (from Swagger Editor/UI containers; needs -cors-origin)
tags:
  - name: auctions
    description: Auction creation, inspection, and explicit closing
  - name: bids
    description: Accepted bids and bid history

paths:
  /v1/auctions:
    post:
      tags: [auctions]
      operationId: createAuction
      summary: Create an auction
      description: |
        Assign a unique auction ID and return a new open auction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAuctionBody' }
      responses:
        '201':
          description: The newly created open auction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
    get:
      tags: [auctions]
      operationId: listAuctions
      summary: List auctions
      description: |
        Return auctions ordered numerically by auction ID, optionally filtered
        by status. No matches produce an empty array, not an error.
      parameters:
        - name: status
          in: query
          required: false
          description: Return only auctions with this status; omit for all auctions
          schema: { $ref: '#/components/schemas/AuctionStatus' }
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Matching auctions, ordered numerically by auction ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionListReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }

  /v1/auctions/{auctionId}:
    parameters:
      - $ref: '#/components/parameters/AuctionId'
    get:
      tags: [auctions]
      operationId: getAuction
      summary: Get an auction
      description: |
        Return the auction, including its highest accepted bid, if any.
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The auction and its current bidding result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }

  /v1/auctions/{auctionId}/closed:
    parameters:
      - $ref: '#/components/parameters/AuctionId'
    get:
      tags: [auctions]
      operationId: getAuctionClosed
      summary: Get an auction's closure
      description: |
        Return true once the auction is closed. An open or unknown auction
        returns 404.
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The auction is closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionClosure' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
    put:
      tags: [auctions]
      operationId: closeAuction
      summary: Close an auction
      description: |
        Create the closure resource with value true. The supplied seller name
        must match the auction's seller name (403 otherwise). Repeating the
        request with the correct seller returns the existing resource.
        Closed auctions cannot reopen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseAuctionBody' }
      responses:
        '201':
          description: The closure was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionClosure' }
        '200':
          description: The auction was already closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionClosure' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }

  /v1/auctions/{auctionId}/winner:
    parameters:
      - $ref: '#/components/parameters/AuctionId'
    get:
      tags: [bids]
      operationId: getAuctionWinner
      summary: Get the winning bid
      description: |
        Return the highest accepted bid for a closed auction. Return 404 for
        an unknown auction, an open auction, or a closed auction without bids.
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The winning bid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }

  /v1/auctions/{auctionId}/bids:
    parameters:
      - $ref: '#/components/parameters/AuctionId'
    get:
      tags: [bids]
      operationId: listBids
      summary: List accepted bids
      description: |
        Return accepted bids in acceptance order. Rejected bids are never
        recorded. An existing auction without bids returns an empty array;
        an unknown auction ID returns 404.
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Accepted bids in acceptance order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidListReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
    post:
      tags: [bids]
      operationId: placeBid
      summary: Place a bid
      description: |
        The auction must exist and be open. The bidder name must differ from
        the seller name (400 otherwise). The first bid must be at least the
        starting price; subsequent bids must strictly exceed the highest bid.
        A closed auction or an insufficient bid returns 409.

        An accepted bid is added to history and becomes the highest bid;
        a rejected bid changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceBidBody' }
      responses:
        '201':
          description: The newly accepted bid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    AuctionId:
      name: auctionId
      in: path
      required: true
      description: |
        Unsigned 64-bit auction ID written in decimal. Negative, non-integer,
        and out-of-range values return 400.
      schema: { $ref: '#/components/schemas/UInt64' }
    Consistency:
      name: consistency
      in: query
      required: false
      description: Read consistency; unsupported values return 400
      schema: { $ref: '#/components/schemas/Consistency' }

  responses:
    Problem:
      description: |
        RFC 9457 problem details. 400 indicates a malformed or invalid request;
        403 a seller name mismatch; 404 a missing auction, closure, or winning
        bid; 409 a closed auction or insufficient bid; 500 an unexpected server
        failure; 503 an unavailable gRPC service; and 504 an exceeded request
        deadline.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Consistency:
      type: string
      enum: [sequential, linearizable]
      default: sequential

    AuctionStatus:
      type: string
      enum: [open, closed]
      x-enum-varnames: [AuctionStatusOpen, AuctionStatusClosed]

    AuctionClosure:
      type: boolean
      enum: [true]

    # uint64 is a custom OpenAPI format. Explicit bounds describe the wire
    # contract; x-go-type keeps Go code generation unsigned and full-width.
    UInt64:
      type: integer
      format: uint64
      minimum: 0
      maximum: 18446744073709551615
      x-go-type: uint64
      description: Unsigned 64-bit integer
      example: 1

    Price:
      type: integer
      format: uint64
      minimum: 1
      maximum: 18446744073709551615
      x-go-type: uint64
      description: Positive amount in integer cents
      example: 1000

    Auction:
      type: object
      description: highestBid is omitted until a bid is accepted.
      required: [id, title, description, sellerName, startingPrice]
      properties:
        id: { $ref: '#/components/schemas/UInt64' }
        title: { type: string }
        description: { type: string }
        sellerName: { type: string }
        startingPrice: { $ref: '#/components/schemas/Price' }
        highestBid:
          $ref: '#/components/schemas/Bid'

    Bid:
      type: object
      required: [id, auctionId, bidderName, amount]
      properties:
        id: { $ref: '#/components/schemas/UInt64' }
        auctionId: { $ref: '#/components/schemas/UInt64' }
        bidderName: { type: string }
        amount: { $ref: '#/components/schemas/Price' }

    CreateAuctionBody:
      type: object
      required: [title, description, sellerName, startingPrice]
      properties:
        title: { type: string }
        description: { type: string }
        sellerName: { type: string }
        startingPrice: { $ref: '#/components/schemas/Price' }

    PlaceBidBody:
      type: object
      required: [bidderName, amount]
      properties:
        bidderName: { type: string }
        amount: { $ref: '#/components/schemas/Price' }

    CloseAuctionBody:
      type: object
      required: [sellerName, closed]
      properties:
        sellerName:
          type: string
          # Preserve presence so an omitted name cannot match an empty seller name.
          x-go-type: '*string'
        closed: { $ref: '#/components/schemas/AuctionClosure' }

    AuctionReply:
      type: object
      required: [auction]
      properties:
        auction: { $ref: '#/components/schemas/Auction' }

    AuctionListReply:
      type: object
      required: [auctions]
      properties:
        auctions:
          type: array
          description: Auctions ordered numerically by ID; empty array if none match
          items: { $ref: '#/components/schemas/Auction' }

    BidReply:
      type: object
      required: [bid]
      properties:
        bid: { $ref: '#/components/schemas/Bid' }

    BidListReply:
      type: object
      required: [bids]
      properties:
        bids:
          type: array
          description: Accepted bids in acceptance order; empty array if no bids exist
          items: { $ref: '#/components/schemas/Bid' }

    Problem:
      type: object
      required: [type, title, detail, status]
      properties:
        type: { type: string, default: 'about:blank' }
        title: { type: string, description: Short summary of the error }
        detail: { type: string, description: What went wrong in this case }
        status: { type: integer, description: The HTTP status code }
