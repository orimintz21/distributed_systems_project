openapi: 3.0.3
# ---------------------------------------------------------------------------
# STEP 1 — Service semantics as an OpenAPI document.
#
# Edit this file in the Swagger Editor (/editor once the server runs, or
# https://editor.swagger.io) and fix every warning. Then `make gen-rest`.
#
# This file describes the running EXAMPLE, a key-value store. Students do
# not implement it: replace it with your own service, keeping the structure:
#   * every operation has an operationId  -> becomes a Go method name
#   * reusable pieces live in components (schemas, parameters, responses)
#   * reads take a `consistency` query parameter
#   * errors are application/problem+json (RFC 9457)
# ---------------------------------------------------------------------------
info:
  title: Replicated Key-Value Store
  version: 2.0.0
  description: |
    Client-facing RESTful API of the replicated key-value store.

    * Reads accept `?consistency=sequential|linearizable` (default: sequential).
      All writes are linearizable.
    * Every entry has a `version`; `GET /v1/keys/{key}` returns it as the
      `ETag`. Send it back in `If-Match` to write only if nothing changed in
      between (412 otherwise).
    * **POST** sets values. **PATCH** modifies them with a read-modify-write
      operation (`append` or `increment`).
servers:
  - url: /
    description: The server that serves this page (use with /docs)
  - url: http://localhost:8080
    description: Node n1 (from Swagger Editor/UI containers; needs -cors-origin)
tags:
  - name: keys
    description: Several keys at once (atomic)
  - name: key
    description: One key

paths:
  /v1/keys:
    get:
      tags: [keys]
      operationId: getKeys
      summary: Read several keys, sorted
      description: |
        Select keys with at most one of `key` (repeatable), `prefix`, or
        `from`/`to` (range [from, to)). No selector = all keys.
        Missing keys are skipped.
      parameters:
        - name: key
          in: query
          required: false
          description: Repeat for several keys (?key=a&key=b)
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: prefix
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string }
        - name: to
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Sort'
        - name: limit
          in: query
          required: false
          description: Maximum number of entries (0 or absent = no limit)
          schema: { type: integer, format: int32, minimum: 0 }
        - name: keysOnly
          in: query
          required: false
          description: Return only the keys (values empty)
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The entries, in sort order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryList' }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      tags: [keys]
      operationId: setKeys
      summary: Set several keys atomically
      description: All or nothing. 412 if any `ifVersion` differs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetKeysBody' }
      responses:
        '200':
          description: The entries after the write, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryList' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [keys]
      operationId: modifyKeys
      summary: Append to or increment several keys atomically (read-modify-write)
      description: All or nothing. 412 if any `ifVersion` differs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyKeysBody' }
      responses:
        '200':
          description: The entries after the operation, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryList' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [keys]
      operationId: deleteKeys
      summary: Delete several keys atomically
      parameters:
        - name: key
          in: query
          required: true
          description: Repeat for several keys (?key=a&key=b)
          schema:
            type: array
            items: { type: string }
            minItems: 1
          style: form
          explode: true
      responses:
        '200':
          description: How many of the keys existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/keys/{key}:
    parameters:
      - $ref: '#/components/parameters/Key'
    get:
      tags: [key]
      operationId: getKey
      summary: Read one key
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The entry
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [key]
      operationId: setKey
      summary: Set one key (create or replace)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetBody' }
      responses:
        '200':
          description: Replaced; the entry after the write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '201':
          description: Created; the new entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [key]
      operationId: modifyKey
      summary: Append to or increment one key (read-modify-write)
      description: |
        Give exactly one of `append` (missing key = "") or `increment`
        (missing key = 0; the value must be an integer).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyBody' }
      responses:
        '200':
          description: The entry after the operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [key]
      operationId: deleteKey
      summary: Delete one key
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted (also returned if the key did not exist)
        '412': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    Key:
      name: key
      in: path
      required: true
      schema: { type: string }
    Consistency:
      name: consistency
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Consistency' }
    Sort:
      name: sort
      in: query
      required: false
      description: Sort field; prefix `-` for descending. Ties break by key.
      schema:
        type: string
        enum: [key, -key, value, -value, version, -version]
        default: key
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Write only if the entry's ETag (version) equals this
      schema: { type: string }

  headers:
    ETag:
      description: The entry's version, quoted (e.g. "3")
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Consistency:
      type: string
      enum: [sequential, linearizable]
      default: sequential

    Entry:
      type: object
      required: [key, value, version]
      properties:
        key: { type: string }
        value: { type: string }
        version:
          type: integer
          format: int64
          description: Incremented on every write of this key

    EntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }

    SetBody:
      type: object
      required: [value]
      properties:
        value: { type: string }

    ModifyBody:
      type: object
      description: Exactly one of `append` or `increment`
      properties:
        append: { type: string }
        increment: { type: integer, format: int64 }

    SetKeysBody:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string }
              value: { type: string }
              ifVersion:
                type: integer
                format: int64
                description: Write only if the version equals this (0 = must not exist)

    ModifyKeysBody:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          items:
            type: object
            required: [key]
            description: Exactly one of `append` or `increment`
            properties:
              key: { type: string }
              append: { type: string }
              increment: { type: integer, format: int64 }
              ifVersion:
                type: integer
                format: int64

    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int32

    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string, description: Short summary, e.g. "Not Found" }
        status: { type: integer, description: The HTTP status code }
        detail: { type: string, description: What went wrong in this case }
