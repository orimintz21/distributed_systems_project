openapi: 3.0.3
info:
  title: Auction House
  version: 1.0.0
  description: |
    Client-facing RESTful API of the auction house.

    * Reads accept `?consistency=sequential|linearizable` (default: sequential).
      All writes are linearizable.
    * **GET** reads auctions and bid history. **POST** creates auctions or
      places bids. **PATCH** closes an auction.
    * Request and success response bodies use `application/json`.
      Errors use `application/problem+json` (RFC 9457).
servers:
  - url: /
    description: The server that serves this page (use with /docs)
  - url: http://localhost:8080
    description: Node n1 (from Swagger Editor/UI containers; needs -cors-origin)
tags:
  - name: auctions
    description: Auction creation, inspection, and explicit closing
  - name: bids
    description: Accepted bids and bid history

paths:
  /v1/auctions:
    post:
      tags: [auctions]
      operationId: createAuction
      summary: Create an auction
      description: |
        Assign a unique auction ID and return an open auction with no highest
        bid and no winner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAuctionBody' }
      responses:
        '201':
          description: The newly created open auction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
    get:
      tags: [auctions]
      operationId: listAuctions
      summary: List auctions
      description: |
        Return auctions ordered numerically by auction ID, optionally filtered
        by status. No matches produce an empty array, not an error.
      parameters:
        - name: status
          in: query
          required: false
          description: Return only auctions with this status; omit for all auctions
          schema: { $ref: '#/components/schemas/AuctionStatus' }
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Matching auctions, ordered numerically by auction ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionListReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }

  /v1/auctions/{auctionId}:
    parameters:
      - $ref: '#/components/parameters/AuctionId'
    get:
      tags: [auctions]
      operationId: getAuction
      summary: Get an auction
      description: |
        Return the auction, including its highest accepted bid and final
        winner, if any.
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The auction and its current bidding result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [auctions]
      operationId: closeAuction
      summary: Close an auction
      description: |
        The supplied seller name must match the auction's seller name (403
        otherwise). Mark the auction closed and finalize the
        highest accepted bidder as the winner. Without bids, the winner is null.

        Repeating a close request with the correct seller name returns the
        existing result without changing it. Closed auctions cannot reopen.
        PATCH supports only the transition to closed, not general field editing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseAuctionBody' }
      responses:
        '200':
          description: The closed auction, including for a repeated close request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }

  /v1/auctions/{auctionId}/bids:
    parameters:
      - $ref: '#/components/parameters/AuctionId'
    get:
      tags: [bids]
      operationId: listBids
      summary: List accepted bids
      description: |
        Return accepted bids in acceptance order. Rejected bids are never
        recorded. An existing auction without bids returns an empty array;
        an unknown auction ID returns 404.
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Accepted bids in acceptance order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidListReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
    post:
      tags: [bids]
      operationId: placeBid
      summary: Place a bid
      description: |
        The auction must exist and be open. The bidder name must differ from
        the seller name (400 otherwise). The first bid must be at least the
        starting price; subsequent bids must strictly exceed the highest bid.
        A closed auction or an insufficient bid returns 409.

        An accepted bid is added to history and becomes the highest bid;
        a rejected bid changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceBidBody' }
      responses:
        '201':
          description: The newly accepted bid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidReply' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    AuctionId:
      name: auctionId
      in: path
      required: true
      description: |
        Unsigned 64-bit auction ID written in decimal. Negative, non-integer,
        and out-of-range values return 400.
      schema: { $ref: '#/components/schemas/UInt64' }
    Consistency:
      name: consistency
      in: query
      required: false
      description: Read consistency; unsupported values return 400
      schema: { $ref: '#/components/schemas/Consistency' }

  responses:
    Problem:
      description: |
        RFC 9457 problem details. 400 indicates a malformed or invalid request;
        403 a seller name mismatch; 404 an unknown auction; 409 a closed auction
        or insufficient bid; 500 an unexpected server failure; 503 an unavailable
        gRPC service; and 504 an exceeded request deadline.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Consistency:
      type: string
      enum: [sequential, linearizable]
      default: sequential

    AuctionStatus:
      type: string
      enum: [open, closed]

    # uint64 is a custom OpenAPI format. Explicit bounds describe the wire
    # contract; x-go-type keeps Go code generation unsigned and full-width.
    UInt64:
      type: integer
      format: uint64
      minimum: 0
      maximum: 18446744073709551615
      x-go-type: uint64
      description: Unsigned 64-bit integer
      example: 1

    Price:
      type: integer
      format: uint64
      minimum: 1
      maximum: 18446744073709551615
      x-go-type: uint64
      description: Positive amount in integer cents
      example: 1000

    Auction:
      type: object
      required: [id, title, description, sellerName, startingPrice, status, highestBid, winnerName]
      properties:
        id: { $ref: '#/components/schemas/UInt64' }
        title: { type: string }
        description: { type: string }
        sellerName: { type: string }
        startingPrice: { $ref: '#/components/schemas/Price' }
        status: { $ref: '#/components/schemas/AuctionStatus' }
        # Expand the Bid shape so nullable applies directly to an object.
        # In OpenAPI 3.0, nullable alongside a $ref would be ignored.
        highestBid:
          type: object
          nullable: true
          x-go-type: Bid
          description: Highest accepted bid; null before any bid
          required: [id, auctionId, bidderName, amount]
          properties:
            id: { $ref: '#/components/schemas/UInt64' }
            auctionId: { $ref: '#/components/schemas/UInt64' }
            bidderName: { type: string }
            amount: { $ref: '#/components/schemas/Price' }
        winnerName:
          type: string
          nullable: true
          description: Highest bidder when closed; null while open or if closed without bids

    Bid:
      type: object
      required: [id, auctionId, bidderName, amount]
      properties:
        id: { $ref: '#/components/schemas/UInt64' }
        auctionId: { $ref: '#/components/schemas/UInt64' }
        bidderName: { type: string }
        amount: { $ref: '#/components/schemas/Price' }

    CreateAuctionBody:
      type: object
      required: [title, description, sellerName, startingPrice]
      properties:
        title: { type: string }
        description: { type: string }
        sellerName: { type: string }
        startingPrice: { $ref: '#/components/schemas/Price' }

    PlaceBidBody:
      type: object
      required: [bidderName, amount]
      properties:
        bidderName: { type: string }
        amount: { $ref: '#/components/schemas/Price' }

    CloseAuctionBody:
      type: object
      required: [sellerName, status]
      properties:
        sellerName: { type: string }
        status:
          type: string
          enum: [closed]
          description: Only explicit closing is supported

    AuctionReply:
      type: object
      required: [auction, nodeId]
      properties:
        auction: { $ref: '#/components/schemas/Auction' }
        nodeId:
          type: string
          description: ID of the gRPC node that served the operation

    AuctionListReply:
      type: object
      required: [auctions, nodeId]
      properties:
        auctions:
          type: array
          description: Auctions ordered numerically by ID; empty array if none match
          items: { $ref: '#/components/schemas/Auction' }
        nodeId:
          type: string
          description: ID of the gRPC node that served the operation

    BidReply:
      type: object
      required: [bid, nodeId]
      properties:
        bid: { $ref: '#/components/schemas/Bid' }
        nodeId:
          type: string
          description: ID of the gRPC node that served the operation

    BidListReply:
      type: object
      required: [bids, nodeId]
      properties:
        bids:
          type: array
          description: Accepted bids in acceptance order; empty array if no bids exist
          items: { $ref: '#/components/schemas/Bid' }
        nodeId:
          type: string
          description: ID of the gRPC node that served the operation

    Problem:
      type: object
      required: [type, title, detail, status]
      properties:
        type: { type: string, default: 'about:blank' }
        title: { type: string, description: Short summary of the error }
        detail: { type: string, description: What went wrong in this case }
        status: { type: integer, description: The HTTP status code }
